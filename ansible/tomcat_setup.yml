- name: Common tool setup on all the servers
  hosts: appsrvgrp
  become: yes
  vars:
    tom_url: https://archive.apache.org/dist/tomcat/tomcat-8/v8.5.37/bin/apache-tomcat-8.5.37.tar.gz

  tasks:
    - name: Ensure the target OS supports Java 21 provisioning
      assert:
        that:
          - (ansible_os_family == 'RedHat' and ansible_distribution_major_version | int == 9) or
            (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 22)
        fail_msg: "Java 21 provisioning supports Ubuntu 22+ and RHEL-family 9 only."

    - name: Install Java 21 on RHEL-family 9
      dnf:
        name: java-21-openjdk-devel
        state: present
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version | int == 9

    - name: Install Java 21 on Ubuntu 22+
      apt:
        name: openjdk-21-jdk
        state: present
        update_cache: yes
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 22

    - name: Download Tomcat Tar Ball/Binaries
      get_url:
        url: "{{tom_url}}"
        dest: /tmp/tomcat-8.tar.gz

    - name: Add tomcat group
      group:
        name: tomcat
        state: present

    - name: Add tomcat user
      user:
        name: tomcat
        group: tomcat
        shell: /bin/nologin
        home: /usr/local/tomcat8

    - file:
        path: /tmp/tomcat8
        state: directory

    - name: Extract tomcat
      unarchive:
        src: /tmp/tomcat-8.tar.gz
        dest: /tmp/tomcat8/
        remote_src: yes
        list_files: yes
      register: unarchive_info

    - debug:
        msg: "{{unarchive_info.files[0].split('/')[0]}}"

    - name: Synchronize /tmp/tomcat8/tomcat_cont /usr/local/tomcat8.
      synchronize:
        src: "/tmp/tomcat8/{{unarchive_info.files[0].split('/')[0]}}/"
        dest: /usr/local/tomcat8/
      delegate_to: "{{ inventory_hostname }}"

    - name: Change ownership of /usr/local/tomcat8
      file:
        path: /usr/local/tomcat8
        owner: tomcat
        group: tomcat
        recurse: yes

    - name: Setup Tomcat service file on RHEL-family 9
      template:
         src: templates/rhel9-svcfile.j2
         dest: /etc/systemd/system/tomcat.service
         mode: "a+x"
      when: ansible_os_family == 'RedHat' and ansible_distribution_major_version | int == 9

    - name: Setup Tomcat service file on Ubuntu 22+
      template:
         src: templates/ubuntu22-svcfile.j2
         dest: /etc/systemd/system/tomcat.service
         mode: "a+x"
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 22

    - name: Reload systemd service configuration
      systemd:
        daemon_reload: yes 
      when: ansible_os_family == 'RedHat' or ansible_distribution == 'Ubuntu'

    - name: Start & Enable TOmcat 8
      service:
        name: tomcat
        state: started
        enabled: yes

   
